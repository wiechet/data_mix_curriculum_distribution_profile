[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wiechet-pretraindata_jd068"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别预训练数据工程师·训练数据配比与课程学习上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "wiechet" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://wiechet.github.io"
Repository = "https://github.com/wiechet/pretraindata_jd068"
Issues = "https://github.com/wiechet/pretraindata_jd068/issues"

[project.scripts]
pretraindata_jd068 = "pretraindata_jd068:main"

[tool.setuptools]
py-modules = ["pretraindata_jd068"]
